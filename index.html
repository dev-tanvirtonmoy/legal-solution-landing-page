<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Solution | Landing page</title>

    <!-- DaisyUI CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Tailwindcss CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- "Poppins" and "EB Garamond" font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->
    <script
      src="https://kit.fontawesome.com/16daa4f40d.js"
      crossorigin="anonymous"
    ></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              clifford: "#da373d",
              "dark-1": "#111111",
              "dark-2": "#414040",
              "dark-3": "#707070",
              "dark-4": "#A0A0A0",
            },
            fontFamily: {
              eb: ["EB Garamond", "serif"],
              poppins: ["Poppins", "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>

      <nav>
        <div class="navbar font-poppins">
          <div class="navbar-start">

              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="0"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 p-2 shadow"
              >
              <li><a class="text-base text-dark-3 capitalize">Home</a></li>
              <li><a class="text-base text-dark-3 capitalize"><span>services</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 flex items-center gap-1 capitalize"><span>cases</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 flex items-center gap-1 capitalize"><span>blog</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 capitalize"><span>contact us</span></a></li>
              </ul>
            </div>
            <a class="btn btn-ghost text-xl">
                <img src="./images/logo2.png" alt="">
            </a>
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1">
              <li><a class="text-base text-dark-3 capitalize">Home</a></li>
              <li><a class="text-base text-dark-3 capitalize"><span>services</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 flex items-center gap-1 capitalize"><span>cases</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 flex items-center gap-1 capitalize"><span>blog</span><i class="fa-solid fa-chevron-right"></i></a></li>
              <li><a class="text-base text-dark-3 capitalize"><span>contact us</span></a></li>
            </ul>
          </div>
          <div class="navbar-end">
            <button class="bg-[#B68C5A] rounded-lg text-white text-sm md:text-lg px-4 py-2 md:px-7 md:py-5 hover:translate-x-2 hover:translate-y-2 duration-300">Free Consultation</button>
          </div>
        </div>
      </nav>
      <!-- Navbar end here -->
    </header>
    <main></main>
    <footer></footer>

</html>
